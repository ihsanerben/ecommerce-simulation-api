databaseChangeLog:
  - changeSet:
      id: 013-create-support-conversations-and-messages
      author: ihsanerben
      comment: Store persistent USER and ADMIN support conversations.
      changes:
        - createTable:
            tableName: support_conversations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_support_conversation_client
                    references: users(id)
              - column:
                  name: agent_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_support_conversation_agent
                    references: users(id)
              - column:
                  name: subject
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createTable:
            tableName: support_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_support_message_conversation
                    references: support_conversations(id)
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_support_message_sender
                    references: users(id)
              - column:
                  name: content
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: support_conversations
            indexName: idx_support_conversations_client
            columns:
              - column:
                  name: client_id
        - createIndex:
            tableName: support_conversations
            indexName: idx_support_conversations_agent_status
            columns:
              - column:
                  name: agent_id
              - column:
                  name: status
        - createIndex:
            tableName: support_messages
            indexName: idx_support_messages_conversation_sent
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: sent_at
                  descending: true
      rollback:
        - dropTable:
            tableName: support_messages
        - dropTable:
            tableName: support_conversations
