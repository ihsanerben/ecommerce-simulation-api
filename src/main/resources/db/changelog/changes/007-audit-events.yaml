databaseChangeLog:
  - changeSet:
      id: 009-create-audit-events
      author: ihsanerben
      comment: Persist idempotent business-event audit records consumed from Kafka.
      changes:
        - createTable:
            tableName: audit_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_audit_events_event_id
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: actor_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id
        - createIndex:
            tableName: audit_events
            indexName: idx_audit_events_occurred_at
            columns:
              - column:
                  name: occurred_at
                  descending: true
      rollback:
        - dropTable:
            tableName: audit_events
