spring:
  application:
    name: ecommerce-simulation-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
  security:
    csrf-enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
      cookie-name: ECOMMERCE-XSRF-TOKEN
      header-name: X-XSRF-TOKEN

server:
  port: 8080
